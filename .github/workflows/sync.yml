name: Synchro EcoleDirecte

# EcoleDirecte bloque les serveurs de GitHub (adresses « suspectes ») : la synchro
# planifiée tourne sur le PC de la maison (dossier windows/). Ce workflow reste
# disponible à la main, pour un test depuis un réseau autorisé uniquement.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Récupérer EcoleDirecte et régénérer le planning
        env:
          ED_USERNAME: ${{ secrets.ED_USERNAME }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          ED_MFA_ANSWERS: ${{ secrets.ED_MFA_ANSWERS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Europe/Paris
        run: python scripts/sync.py
