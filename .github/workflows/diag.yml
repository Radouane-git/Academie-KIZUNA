name: Diagnostic bibliotheque
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ecoledirecte-py-client==0.2.1
      - run: |
          python - <<'PY'
          import inspect, ecoledirecte_py_client, os
          d = os.path.dirname(ecoledirecte_py_client.__file__)
          print(sorted(os.listdir(d)))
          src = open(os.path.join(d, "client.py")).read()
          print(src[:16000])
          PY
