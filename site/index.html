<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E5E6F">
<meta name="application-name" content="Académie Kizuna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kizuna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Académie Kizuna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=Dela+Gothic+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Académie Kizuna : carte d'élève, missions par rang, pictos autocollants. Couleur du profil dans --child / --acc. */
:root{
  --paper:#F3F6F5; --card:#FFFFFF; --ink:#0D3B45; --muted:#4F6B70; --line:#D5E2E0; --soft:#E9F0EF;
  --child:#0E5E6F; --acc:#FF6B4A; --ctxt:#FFFFFF;
  --rS:#FF6B4A; --rA:#0D3B45; --rB:#0E5E6F; --rC:#9CC9C2; --rD:#E9EEF0;
  --k-dev:#0E5E6F; --k-app:#5B3FA8; --k-rev:#FF6B4A; --k-lec:#1E7A4E; --k-rel:#0E5E6F; --k-cor:#C48A00; --k-ran:#8a7a14; --k-org:#56657a; --k-calm:#9aa6b6; --k-loi:#C2366C;
  --ok:#1E7A4E; --stamp:#C62E3A;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --kanji:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.02rem;font-weight:800}
p{margin:.3rem 0 .6rem;text-wrap:pretty}
small{display:block;color:var(--muted);font-size:.82rem}
a{color:var(--child)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 64px}

/* logo, tampon, pictos, rangs */
.logo{border-radius:50%;background-color:#0E5E6F;background-image:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.16) 0deg 5deg,transparent 5deg 13deg);border:3px solid #FF6B4A;display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo span{font-family:var(--kanji);color:#fff;line-height:1}
.stamp{border-radius:12px;background:var(--stamp);transform:rotate(-8deg);box-shadow:inset 0 0 0 4px var(--stamp),inset 0 0 0 6px #fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.stamp span{font-family:var(--kanji);color:#fff;line-height:1}
.pic{border-radius:12px;background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.pic.none{border:0;box-shadow:none;background:none;height:1px}
.rank{width:28px;height:28px;border-radius:7px;font-family:var(--display);font-weight:900;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.rS{background:var(--rS);color:#fff}.rA{background:var(--rA);color:#fff}.rB{background:var(--rB);color:#fff}.rC{background:var(--rC);color:var(--ink)}.rD{background:var(--rD);color:var(--ink)}

/* barre du haut */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark span{font-family:var(--display);font-weight:500;font-size:.62rem;letter-spacing:.32em}
.wordmark b{font-family:var(--display);font-weight:900;font-size:1.25rem;letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;min-height:44px}
.tab .dot{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.tab:hover{border-color:var(--tc)}
.tab[aria-current="page"]{background:var(--tc);border-color:var(--tc);color:var(--tt)}
.tab[aria-current="page"] .dot{background:var(--tt)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--muted)}
.status i{width:9px;height:9px;border-radius:50%;background:#b8c4c6}
.status.ok i{background:var(--ok)}.status.bad i{background:var(--stamp)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}

/* carte d'élève */
.hero{border-radius:28px;padding:26px 30px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px;margin-bottom:14px;background-image:repeating-conic-gradient(from 0deg at 82% 30%,rgba(255,255,255,.12) 0deg 4deg,transparent 4deg 12deg)}
.hero-id{display:flex;align-items:center;gap:16px}
.shield{width:72px;height:82px;clip-path:polygon(50% 0,100% 14%,100% 58%,50% 100%,0 58%,0 14%);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:1.6rem;flex:none}
.over{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.92;display:block;margin-bottom:6px}
.hero h1{font-weight:900;font-size:clamp(1.7rem,4vw,2.5rem)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badges span{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:700}
.hero-stats{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.wk-prog{min-width:220px}
.wk-prog>div:first-child{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wk-prog b{font-family:var(--display);font-weight:900;font-size:1.6rem}
.wk-prog .track{background:rgba(255,255,255,.25);height:10px;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.wk-prog .track i{display:block;height:100%;border-radius:99px}
.hero small{color:inherit;opacity:.88}
.hero-stamps{display:flex;align-items:center;gap:10px}
.hero-stamps b{font-family:var(--display);font-weight:900;font-size:1.6rem;display:block;line-height:1}
.hero-stats.parents>div b{font-family:var(--display);font-weight:900;font-size:1.8rem;display:block;line-height:1.1}

/* semaines et jours */
.weeks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.wk{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 13px;font-weight:700;cursor:pointer;min-height:44px}
.wk small{display:inline;font-weight:400}
.wk[aria-pressed="true"]{border-color:var(--child);background:var(--child);color:var(--ctxt)}
.wk[aria-pressed="true"] small{color:inherit;opacity:.85}
.wk:disabled{opacity:.5;cursor:default}
.days{display:grid;gap:8px;margin-bottom:16px}
.day{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day b{font-family:var(--display);font-weight:900;font-size:1.25rem}
.day .bar,.cell .bar{display:block;width:70%;height:5px;border-radius:9px;background:var(--soft);overflow:hidden}
.day .bar i,.cell .bar i{display:block;height:100%;background:var(--child)}
.day.today{border-color:var(--acc)}
.day[aria-selected="true"]{background:var(--child);border-color:var(--child);color:var(--ctxt)}
.day[aria-selected="true"] span{color:inherit}
.day[aria-selected="true"] .bar{background:rgba(255,255,255,.3)}.day[aria-selected="true"] .bar i{background:var(--acc)}

/* missions */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.card{background:var(--card);border-radius:22px;padding:20px 22px;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(13,59,69,.35)}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.mhead h2{font-size:1.25rem}
.mhead>span{color:var(--muted);font-size:.9rem}
.ok-txt{color:var(--ok)}
.track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--child);border-radius:99px;transition:width .3s}
.track.big{margin:10px 0 6px}
.boom{margin:10px 0 4px;border-radius:16px;padding:12px;text-align:center;background:var(--acc);background-image:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.22) 0deg 4deg,transparent 4deg 12deg)}
.boom span{font-family:var(--display);font-weight:900;color:#fff;letter-spacing:.04em;text-shadow:2px 2px 0 var(--ink)}
.tl{list-style:none;margin:8px 0 0;padding:0}
.m{display:grid;grid-template-columns:52px 50px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--soft)}
.m:last-child{border-bottom:0}
.m .t{font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--muted)}
.mtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.lab{font-weight:700}
.det{font-size:.88rem;color:var(--muted)}
.m.calm{padding:7px 6px}
.m.calm .lab{font-weight:400;color:var(--muted)}
.m.calm .pic{opacity:.7;box-shadow:none;border-color:var(--rC)}
.overbox{margin-top:14px;border:2px dashed var(--rS);border-radius:16px;padding:12px 14px 4px}
.overbox h3{font-family:var(--display);font-size:.95rem;margin:0;color:var(--rS)}
.overbox p{font-size:.88rem;color:var(--muted)}
.m.done .lab{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.m.done .pic{opacity:.5}
.m.loi .lab{color:var(--k-loi)}
.chk{appearance:none;-webkit-appearance:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--rC);background:#fff;cursor:pointer;margin:0;display:inline-grid;place-content:center;flex:none}
.chk:hover{border-color:var(--child)}
.chk:checked{background:var(--child);border-color:var(--child)}
.chk:checked::after{content:"";width:14px;height:8px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-2px)}
.rel .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.rel em{font-style:normal;font-size:.78rem;color:var(--muted);min-width:66px}
.chip{border:2px solid var(--rC);background:#fff;border-radius:999px;padding:4px 11px;font-size:.84rem;font-weight:700;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--child);border-color:var(--child);color:var(--ctxt)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px;font-size:.84rem;color:var(--muted)}
.legend .rank{width:22px;height:22px;font-size:11px}
.legend span:not(.rank){margin-right:8px}

/* emploi du temps */
.edt{margin:4px 0 8px;border:2px solid var(--soft);border-radius:14px;padding:6px 12px}
.edt summary{cursor:pointer;font-weight:700;font-size:.9rem;padding:4px 0;min-height:32px;display:list-item}
.edt .cx{color:var(--rS)}
.edt ul{list-style:none;margin:4px 0;padding:0}
.edt li{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--soft)}
.edt .et{font-family:var(--display);font-weight:800;font-size:.8rem;color:var(--muted);min-width:96px}
.edt .em{flex:1;min-width:0}
.edt li.cancelled .em b{text-decoration:line-through;color:var(--muted)}
.edt li.cancelled small{color:var(--rS)}
.btn.mini{min-height:34px;padding:5px 11px;font-size:.82rem;margin:0}
/* colonne de droite */
.side{display:flex;flex-direction:column;gap:14px}
.side-card h2{font-size:.92rem;margin-bottom:8px}
.side-card ul{margin:0;padding-left:1.1rem}
.side-card li{margin:.25rem 0}
.none{color:var(--muted);font-style:italic}
.ev{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft)}
.ev:last-child{border-bottom:0}
.ev span:not(.rank){flex:1;min-width:0}
.ev>b{font-family:var(--display);font-size:.8rem;color:var(--rS);white-space:nowrap}
.ev.past{opacity:.55}.ev.past>b{color:var(--muted)}
.sensei{background:var(--ink);color:#fff}
.sensei .sensei-t{color:var(--acc)}
.sensei-msg{font-size:1.05rem;font-weight:700;margin:0 0 4px}
.sensei .muted{color:#fff;opacity:.75}
.stamp-row{display:flex;align-items:center;gap:14px;padding:8px 0}
.stamp-row span:not(.stamp){display:flex;flex-direction:column;min-width:0}
.xl{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--soft)}
.xl:last-child{border-bottom:0}
.xl>span:not(.pic){flex:1;min-width:0;display:flex;flex-direction:column}
.loi-t{color:var(--k-loi)!important;font-weight:700;text-transform:uppercase;font-size:.7rem!important;letter-spacing:.06em}

.lib-stats{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.lib-stats b{font-family:var(--display);font-weight:900;font-size:1.4rem;display:block;line-height:1.1}
.books{list-style:none;margin:6px 0 8px;padding:0}
.books li{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft)}
.books li span{flex:1;min-width:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.bookf{margin-top:8px;border-top:1px solid var(--soft);padding-top:6px}
/* parents */
.scrollbox{max-height:340px;overflow-y:auto;margin-top:8px;padding-right:6px;border-top:1px solid var(--soft);border-bottom:1px solid var(--soft);overscroll-behavior:contain}
.scrollbox:focus-visible{outline:3px solid var(--acc)}
.xl-h{display:block}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
.cols.two{grid-template-columns:1fr 1fr;margin:0;gap:10px}
.cols.three{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:0;gap:10px}
.wide{grid-column:1/-1}
.f label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem;margin:8px 0}
.f input:not([type=checkbox]),.f select,.f textarea{border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;font-weight:400;font-size:1rem;min-height:44px}
.f input:not([type=checkbox]),.f select{width:100%;min-width:0}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--child);outline:none}
.ftitle{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.btn{background:var(--child);color:var(--ctxt);border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:44px;margin-top:6px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--soft);color:var(--ink)}
.stamp-btn{background:var(--stamp);color:#fff}
.sensei-card{border-top:6px solid var(--acc)}
.stamp-card{border-top:6px solid var(--stamp)}
.warn{border-left:6px solid var(--rS)}
.msg{background:#E7F4EC;color:#14532d;border-radius:12px;padding:8px 12px;font-weight:700}
.msg.err{background:#FDE8E6;color:#8a1c12}
.ovwrap{overflow-x:auto;margin-top:8px}
.ov{border-collapse:collapse;width:100%;min-width:560px}
.ov th{font-size:.78rem;color:var(--muted);font-weight:700;padding:6px}
.ov td{padding:4px;text-align:center;border-top:1px solid var(--soft)}
.ov td.n{text-align:left;font-weight:700;white-space:nowrap}
.ov td.n i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--child);margin-right:8px}
.cell{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:6px 2px;border-radius:10px}
.cell:hover{background:var(--soft)}
.cell .bar{width:44px}
.cell.full small{color:var(--ok);font-weight:700}

/* connexion */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#0E5E6F;background-image:repeating-conic-gradient(from 0deg at 50% 30%,rgba(255,255,255,.08) 0deg 4deg,transparent 4deg 12deg)}
.login-card{width:min(400px,100%);text-align:center;display:flex;flex-direction:column;align-items:center}
.login-card label{width:100%;text-align:left}
.login-card .btn{width:100%;background:#0E5E6F;color:#fff}
.brand-big{display:flex;flex-direction:column;line-height:1;margin-top:14px}
.brand-big span{font-family:var(--display);font-weight:500;font-size:.8rem;letter-spacing:.34em}
.brand-big b{font-family:var(--display);font-weight:900;font-size:2rem}
.tagline{color:var(--muted)}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .wrap{padding:12px 12px 72px}
  .brand{margin-right:0;flex-basis:100%}
  .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}
  .tab{flex:none}
  .hero{padding:20px;border-radius:22px}
  .shield{width:56px;height:64px;font-size:1.2rem}
  .days{grid-auto-flow:column;grid-template-columns:none!important;grid-auto-columns:minmax(64px,1fr);overflow-x:auto}
  .m{grid-template-columns:44px 42px minmax(0,1fr) auto;gap:10px}
  .m .rank{display:none}
  .m .pic:not(.none){transform:scale(.88)}
  .card{padding:16px}
  .cols{grid-template-columns:1fr}
}

/* ===== 0.5.0 : navigation inspirée de Brilliant (polices inchangées) ===== */
:root{--paper:#F6F8F8;--line:#DCE7E6}
.wrap{max-width:1200px}
.topbar{position:sticky;top:0;z-index:5;background:#fff;margin:-16px -20px 24px;padding:10px 20px;border-bottom:2px solid var(--line);gap:12px 28px}
.brand{margin-right:0}
.secnav{display:flex;gap:6px;margin-right:auto}
.sec{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;min-height:44px}
.sec .pic{width:30px!important;height:30px!important;border-width:1.5px;box-shadow:1px 1px 0 var(--ink);border-radius:9px}
.sec[aria-current="page"]{color:var(--ink);border-bottom-color:var(--child);border-radius:12px 12px 0 0}
.sec:hover{background:var(--soft)}
.secpic{display:none}
.evtxt{color:#C9472C!important;font-weight:700}
.who{display:flex;align-items:center;gap:14px;margin-left:auto}
.streak{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800}
.profiles{display:flex;gap:6px;flex-wrap:wrap}
.prof{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 4px;font-weight:700;cursor:pointer;min-height:44px}
.prof .av{width:32px;height:32px;border-radius:50%;background:var(--tc);color:var(--tt);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:.85rem}
.prof .pn{font-size:.9rem}
.prof:not([aria-current="page"]):not(.txt) .pn{display:none}
.prof:not(.txt):not([aria-current="page"]){padding-right:4px}
.prof.txt{padding:4px 14px;font-size:.9rem}
.prof[aria-current="page"]{border-color:var(--tc)}
.prof.txt[aria-current="page"]{background:var(--tc);color:var(--tt)}
.kid-hero{margin:0}
.kid-hero h1{font-weight:900}
.kid-hero .hsub{margin:6px 0 0;font-size:1.02rem;opacity:.92}
.hero-ring{display:flex;align-items:center;gap:10px}
.hero-ring small,.hero-num small{color:inherit;opacity:.88;line-height:1.2}
.hero-num b{font-family:var(--display);font-weight:900;font-size:1.6rem;display:block;line-height:1.1}
.prof.gear{width:44px;height:44px;padding:0;justify-content:center;color:var(--muted)}
.prof.gear[aria-current="page"]{background:var(--tc);color:var(--tt)}
.setlink{display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px 18px;border-radius:16px;border:2px dashed var(--line);color:var(--muted);text-decoration:none;font-weight:700}
.setlink:hover{border-color:#3A4250;color:var(--ink)}
.kicker{display:block;font-size:.95rem;color:var(--muted)}
.kicker.acc,.acc{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#C9472C}
.today{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;align-items:start}
.main-col{display:flex;flex-direction:column;gap:22px;min-width:0}
.greet h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.4vw,2.5rem);margin:6px 0 4px}
.greet p{font-size:1.08rem;color:var(--muted);margin:0}
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:520px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;border:2px solid transparent;background:none;cursor:pointer;min-height:44px}
.dchip span{font-size:.75rem;color:var(--muted);font-weight:700}
.dchip b{font-family:var(--display);font-weight:800;font-size:1.05rem}
.dchip i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dchip i.part{background:var(--acc)}.dchip i.full{background:var(--child)}
.dchip.is-today span{color:var(--ink)}
.dchip[aria-pressed="true"]{background:#fff;border-color:var(--ink)}
.dchip:hover{background:#fff}
.nextcard{display:flex;align-items:center;gap:24px;background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:24px 28px}
.nc-pic .pic{width:88px!important;height:88px!important;border-radius:22px;background:var(--soft);border:0;box-shadow:none}
.nc-txt{flex:1;min-width:0}
.nc-txt h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:6px 0 4px;line-height:1.25}
.nc-txt p{color:var(--muted);margin:0}
.cta{appearance:none;border:0;background:var(--child);color:var(--ctxt);font-weight:700;font-size:1.05rem;border-radius:14px;padding:15px 26px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28);min-height:52px;flex:none}
.cta:hover{filter:brightness(1.07)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.cta.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.pathcard{padding:24px 26px 8px}
.pc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.pc-head h2{font-size:1.15rem}
.pc-head span{color:var(--muted)}
.path{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding-bottom:22px}
.step::before{content:"";position:absolute;left:30px;top:8px;bottom:-8px;width:4px;border-radius:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--child)}
.node-col{display:flex;justify-content:center;position:relative;z-index:1}
.node-wrap{position:relative;width:56px;height:56px}
.chk.node{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff}
.chk.node.now{border:4px solid var(--acc);box-shadow:0 0 0 7px color-mix(in srgb,var(--acc) 22%,transparent)}
.chk.node:checked{background:var(--child);border-color:var(--child)}
.chk.node:checked::after{width:20px;height:11px;border-width:0 0 4px 4px}
.node-wrap .np{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.node.rel{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.node.rel.done{background:var(--child);border-color:var(--child)}
.node.rel.done::after{content:"";width:20px;height:11px;border:solid #fff;border-width:0 0 4px 4px;transform:rotate(-45deg) translate(1px,-2px)}
.step.now .node.rel{border:4px solid var(--acc)}
.st-txt{display:flex;flex-direction:column;gap:2px;padding-top:6px;min-width:0}
.st-t{font-size:.85rem;color:var(--muted)}
.st-l{font-weight:700;font-size:1.05rem;text-align:left}
.st-l.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.st-l.link:hover{text-decoration:underline;text-underline-offset:3px}
.st-d{font-size:.9rem;color:var(--muted)}
.step.done .st-l{text-decoration:line-through;color:var(--muted)}
.step.loi .st-l{color:var(--k-loi)}
.step.calm{grid-template-columns:64px minmax(0,1fr);padding-bottom:14px}
.step.calm .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line);margin-top:4px}
.step.calm .st-txt{flex-direction:row;gap:10px;padding-top:0;align-items:baseline}
.step.calm .st-l{font-weight:400;color:var(--muted);font-size:.95rem}
.overbox .path{margin-top:10px}
.prog-card{display:flex;align-items:center;gap:16px}
.prog-card b{font-family:var(--display);font-weight:800;display:block}
.ring{position:relative;display:inline-flex;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800}
.evalcard{background:var(--ink);color:#fff}
.evalcard .acc{color:var(--acc)}
.evalcard h2{color:#fff;margin:6px 0}
.evalcard p{opacity:.88;margin:0}
.evalcard .more{color:#fff;font-weight:700;display:inline-block;margin-top:8px}
.dots{margin:0;padding-left:1.1rem}
.dots li{margin:.3rem 0}
.narrow{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.narrow .cols{margin-top:0}
.weeklist{list-style:none;margin:0;padding:0}
.wrow{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;border-bottom:1px solid var(--soft);padding:12px 4px;text-align:left;cursor:pointer;border-radius:12px}
.weeklist li:last-child .wrow{border-bottom:0}
.wrow:hover{background:var(--soft)}
.wrow.is-today b{color:var(--child)}
.wr-txt{flex:1;display:flex;flex-direction:column}
.wr-txt .acc{font-size:.68rem}
.chev{font-size:1.6rem;color:var(--muted)}
.books li{align-items:center}
.focus-bg{position:fixed;inset:0;background:rgba(13,59,69,.45);z-index:20}
.focus{position:fixed;z-index:21;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:24px;box-shadow:0 24px 60px -20px rgba(13,59,69,.5);display:flex;flex-direction:column;--child:inherit}
.focus header{display:flex;align-items:center;gap:14px;padding:18px 20px}
.fx{background:none;border:0;font-size:1.8rem;line-height:1;color:var(--muted);cursor:pointer;width:44px;height:44px}
.fbar{flex:1;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.focus header b{font-family:var(--display);font-size:.9rem}
.fbody{padding:6px 28px 18px;display:flex;flex-direction:column;gap:10px}
.fbody .pic{width:84px!important;height:84px!important;border-radius:24px;background:var(--soft);border:0;box-shadow:none;margin-bottom:6px}
.fbody h2{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.25}
.fbody p{color:var(--muted);font-size:1.02rem}
.tipbox{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:16px;padding:12px 14px;font-size:.92rem;margin-top:6px}
.focus footer{padding:16px 28px 24px;border-top:2px solid var(--soft);display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
.focus footer .linkbtn{padding:8px;font-weight:700}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;align-items:center}
.wrap.kid .hero{margin-bottom:0}
@media (max-width:900px){
  .today{grid-template-columns:1fr;gap:22px}
  .topbar{margin:-12px -12px 18px;padding:8px 12px}
  .brand{flex-basis:auto}
  .wordmark span{display:none}
  .secnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));margin:0;gap:0}
  .secpic{display:inline-flex}
  .sec{flex-direction:column;gap:3px;font-size:.72rem;padding:4px 6px;border-bottom:0;flex:1;align-items:center}
  .sec[aria-current="page"]{background:var(--soft);border-radius:12px}
  .who{gap:8px;flex:1;justify-content:flex-end;min-width:0}
  .profiles{flex-wrap:nowrap;overflow-x:auto}
  .prof .pn{display:none}
  .prof{padding:3px}
  .prof.txt{padding:3px 10px;font-size:.8rem}
  .wrap.kid{padding-bottom:96px}
  .prof[data-view="conseils"]{display:none}
  .foot{flex-wrap:wrap;text-align:center}
  .nextcard{flex-direction:column;align-items:stretch;gap:14px;padding:20px}
  .nc-pic .pic{width:64px!important;height:64px!important}
  .nextcard .cta{width:100%}
  .dstrip{max-width:none}
  .pathcard{padding:18px 14px 4px}
  .step{grid-template-columns:52px minmax(0,1fr);gap:12px}
  .step::before{left:24px}
  .node-wrap,.chk.node,.node.rel{width:48px;height:48px}
  .focus{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-height:92%;border-radius:24px 24px 0 0}
}


/* ===== 0.7.0 : corrections de l'audit ===== */
.kicker.acc,.acc{color:#B83E25}
.ev>b,.evtxt{color:#B83E25!important}
.sensei .sensei-t,.evalcard .acc{color:#FF8A6E}
.chip{min-height:44px}
.edt summary{min-height:44px;display:flex;align-items:center}
.btn.mini{min-height:44px}
.prof.gear{width:44px;min-width:44px}
.evalcard .more,.foot a{display:inline-block;padding:10px 0}
.kid-hero .over{text-transform:none;letter-spacing:0;font-size:.95rem}
.hint{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:.92rem;margin:-4px 0 16px}
.hint .linkbtn{font-weight:700;color:var(--ink);padding:8px 4px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.chk.node.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.chk.node.pop{animation:none}}
.msg{position:relative}
/* menu des profils (téléphone) */
.pmenu{display:none;position:relative}
.pmenu summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;min-height:44px;font-weight:700;background:#fff}
.pmenu summary::-webkit-details-marker{display:none}
.pmenu .av,.pm-item .av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:.85rem;flex:none}
.pm-list{position:absolute;right:0;top:calc(100% + 8px);z-index:12;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 14px 34px -14px rgba(13,59,69,.4);padding:6px;min-width:220px;display:flex;flex-direction:column}
.pm-item{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:8px 10px;min-height:48px;font-weight:700;text-align:left;cursor:pointer}
.pm-item:hover,.pm-item[aria-current="page"]{background:var(--soft)}
.pm-item svg{width:20px;height:20px}
/* alertes du jour (téléphone) */
.m-alerts{display:none;flex-direction:column;gap:10px}
.m-ev{background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;display:flex;flex-direction:column}
.m-ev b{color:#FF8A6E;font-family:var(--display);font-size:.9rem}
.m-due{background:#fff;border:2px solid var(--line);border-radius:16px;padding:0 16px}
.m-due summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.m-due ul{margin:0 0 12px}
.m-sensei{background:#fff;border:2px solid var(--line);border-left:6px solid var(--acc);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;font-size:.95rem}
.m-sensei b{font-size:.8rem;color:var(--muted)}
/* vue parents */
.kidcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.kidcard{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-left:8px solid var(--child);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;min-height:44px}
.kidcard:hover{border-color:var(--child)}
.kc-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.kc-txt b{font-family:var(--display);font-weight:800;font-size:1.05rem}
.fold{background:#fff;border-radius:22px;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(13,59,69,.35)}
.fold>summary{list-style:none;cursor:pointer;padding:16px 22px;font-weight:700;min-height:56px;display:flex;align-items:center;color:var(--ink);border-radius:22px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:hover{background:var(--soft)}
.fold[open]>summary{border-bottom:1px solid var(--soft);border-radius:22px 22px 0 0}
.fold>form.card{box-shadow:none;border-top:0;border-radius:0 0 22px 22px}
.fold.wide{grid-column:1/-1}

/* ===== 0.8.0 : accueil, bandeau sur une ligne, tampon lisible ===== */
.home{max-width:760px;margin:10px auto 0;display:flex;flex-direction:column;gap:22px}
.home-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.home-head h1{font-family:var(--display);font-weight:900;font-size:clamp(1.8rem,4vw,2.4rem)}
.home-head p{color:var(--muted);font-size:1.1rem;margin:0}
.home-grid{display:flex;flex-direction:column;gap:14px}
.home-card{display:flex;align-items:center;gap:18px;border-radius:24px;padding:20px 24px;text-decoration:none;background-image:repeating-conic-gradient(from 0deg at 85% 30%,rgba(255,255,255,.12) 0deg 4deg,transparent 4deg 12deg);box-shadow:0 6px 0 rgba(0,0,0,.18);min-height:96px;transition:transform .12s}
.home-card:hover{transform:translateY(-2px)}
.home-card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.home-card .shield{width:56px;height:64px;font-size:1.3rem}
.hc-txt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.hc-txt b{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1.1}
.hc-txt small{color:inherit;opacity:.92;font-size:.95rem}
.home-more{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.home-small{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border:2px solid var(--line);border-radius:999px;background:#fff;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px}
.home-small .av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800}
.stamp span,.logo span{font-weight:400;font-synthesis:none}
.hero .stamp{box-shadow:inset 0 0 0 4px var(--stamp),inset 0 0 0 6px #fff,0 0 0 3px #fff,0 4px 0 3px rgba(0,0,0,.18)}
@media (min-width:901px){
  .topbar{flex-wrap:nowrap;gap:10px 18px}
  .secnav{gap:2px;min-width:0}
  .sec{padding:8px 9px;font-size:.93rem;white-space:nowrap}
  .who{gap:10px;flex:none}
  .profiles{flex-wrap:nowrap}
  .prof .pn{font-size:.85rem}
}

/* ===== 0.11.0 : méthode de travail ===== */
.methrow{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:16px;padding:12px;margin-top:8px}
.rr-q.small{font-size:.85rem}
.m-chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:.85rem;cursor:pointer;min-height:40px}
.mchip[aria-pressed="true"]{background:var(--child);border-color:var(--child);color:var(--ctxt)}
.focus footer .methrow{text-align:left;margin:0 0 4px}
.tipbox.coach{flex-direction:column;align-items:flex-start;gap:2px;background:#FFF4D6}
.methcard .mk{padding:8px 0;border-bottom:1px solid var(--soft)}
.m-bars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mbar{position:relative;display:block;background:var(--soft);border-radius:8px;height:26px;overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:#9CC9C2}
.mbar em{position:relative;font-style:normal;font-size:.8rem;font-weight:700;padding:0 8px;line-height:26px}
.cols>.methcard{grid-column:1/-1}
/* ===== 0.12.0 : conseils enrichis ===== */
.tipfilter{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tip{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(13,59,69,.35);border-top:5px solid #9CC9C2}
.tip.src-prof{border-top-color:#5B3FA8}.tip.src-livre{border-top-color:#C2366C}.tip.src-famille{border-top-color:#FF6B4A}
.tip h3{font-family:var(--display);font-size:1rem;margin:4px 0 6px}
.tip p{margin:0;font-size:.95rem}
.tip-src{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tip.small{box-shadow:none;border:2px solid var(--line);border-top-width:5px}
.tow{display:flex;flex-direction:column;gap:8px}
.tow .linkbtn{align-self:flex-start;font-weight:700;padding:8px 0}
.tipbox.ctx{flex-direction:column;align-items:flex-start;gap:2px;background:#EEF4FF}
.chk-chip{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:6px!important;margin:0!important}
.chk-chip input{width:18px;height:18px;min-height:0!important}
/* ===== 0.11.0 : idées des enfants ===== */
.kid-idea{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ki-title{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 0}
.ki-row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.92rem;padding:4px 0}
.ki-st{font-size:.75rem;border-radius:999px;padding:2px 10px;white-space:nowrap}
.ki-st.ok{background:#E7F4EC;color:#14532d}.ki-st.wait{background:#FFF4D6;color:#6B4E00}.ki-st.non{background:var(--soft);color:var(--muted)}
.kid-idea-form{border-top:1px solid var(--soft);padding-top:6px}
.pend-ideas{background:#FFF8E6;border-radius:14px;padding:6px 12px 10px;margin:6px 0 12px}
.pi-row{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid #F1E3BC}
.pi-row:last-child{border-bottom:0}
.pi-row small{display:block}
.pi-act{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.pi-date{display:flex;flex-direction:column;font-size:.78rem;font-weight:700;gap:2px}
.pi-date input{border:2px solid var(--line);border-radius:10px;padding:6px 8px;min-height:44px}
/* ===== 0.10.0 : retours des professeurs ===== */
.acts-title{grid-column:1/-1;font-family:var(--display);font-size:1.1rem;margin:14px 0 -4px}
.cols>.hardcard,.cols>.ovcard{grid-column:1/-1}
.tnote{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;background:#fff}
.tnote header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:6px}
.tnote header small{margin-left:auto}
.tn-part{margin:6px 0}
.tn-part em{font-style:normal;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tn-part p{margin:2px 0 0}
.tn-part.good em{color:#1E7A4E}.tn-part.expect em{color:#B83E25}.tn-part.next em{color:#5B3FA8}
.goal{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:2px solid var(--line);border-left:6px solid var(--child);border-radius:14px;padding:10px 12px;margin:6px 0;background:#fff}
.goal.ok{border-left-color:#1E7A4E}
.g-txt{flex:1;min-width:180px;display:flex;flex-direction:column}
.g-txt em{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:700}
.g-btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;min-height:44px}
.g-btn[aria-pressed="true"]{background:#1E7A4E;border-color:#1E7A4E;color:#fff}
.notes-card .nk h3{font-family:var(--display);font-size:.95rem;margin:14px 0 4px}
.nrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft)}
.nr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nr-txt p{margin:4px 0 0;font-size:.92rem}
